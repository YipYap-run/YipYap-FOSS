# event-display: Knative's canonical echo sink. Logs every CloudEvent it
# receives to stdout so tests can scrape the pod logs for ce-id / ce-type.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-display
  labels:
    app: event-display
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-display
  template:
    metadata:
      labels:
        app: event-display
    spec:
      containers:
        - name: event-display
          image: gcr.io/knative-releases/knative.dev/eventing/cmd/event_display
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: event-display
  labels:
    app: event-display
spec:
  selector:
    app: event-display
  ports:
    - name: http
      port: 80
      targetPort: 8080
