services:
  yipyap:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - yipyap-data:/data
    environment:
      YIPYAP_DB_DSN: /data/yipyap.db
      # Leave unset to have YipYap generate a secret and keep it in /data/jwt_secret.
      YIPYAP_JWT_SECRET: ${YIPYAP_JWT_SECRET:-}
      YIPYAP_DEV_SEED: "${YIPYAP_DEV_SEED:-false}"
    restart: unless-stopped

volumes:
  yipyap-data:
