type: run.yipyap.monitor.degraded.v1
direction: out
summary: Emitted when a monitor transitions to the DEGRADED state.
subject_template: "monitor/{monitor_id}"
data:
  - name: monitor_id
    type: string
    required: true
    format: ulid
  - name: check_id
    type: string
    required: true
    format: ulid
  - name: reason
    type: string
    required: true
    description: What caused the degraded classification (e.g. "latency > p95 threshold", "partial content match failure").
  - name: checked_at
    type: string
    required: true
    format: rfc3339
