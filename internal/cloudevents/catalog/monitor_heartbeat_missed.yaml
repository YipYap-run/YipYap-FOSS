type: run.yipyap.monitor.heartbeat_missed.v1
direction: out
summary: Emitted when a heartbeat monitor's expected window expires without a ping.
subject_template: "monitor/{monitor_id}"
data:
  - name: monitor_id
    type: string
    required: true
    format: ulid
  - name: expected_by
    type: string
    required: true
    format: rfc3339
    description: The timestamp by which a heartbeat ping was expected.
  - name: last_seen_at
    type: string
    required: false
    format: rfc3339
    description: Timestamp of the most recent observed heartbeat, if any.
