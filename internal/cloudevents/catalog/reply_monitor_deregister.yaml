type: run.yipyap.reply.monitor.deregister.v1
direction: reply
summary: Disable the monitor associated with this alert. Highest-blast-radius reply type, requires a separate per-channel explicit-trust flag. UI renders a warning banner when enabled.
subject_template: "monitor/{monitor_id}"
data:
  - name: alert_id
    type: string
    required: true
    format: ulid
    description: Alert ID. Used solely for ce_alertref validation; the handler derives monitor_id from the correlated outbound event.
  - name: monitor_id
    type: string
    required: true
    format: ulid
    description: The monitor to deregister. Must match the monitor referenced by the correlated outbound event's registry entry, cross-monitor deregister rejected.
  - name: reason
    type: string
    required: true
    description: Justification required by the handler. Stored in audit log. Must be at least 16 characters, forces an intentional, documented action.
