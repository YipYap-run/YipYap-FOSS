name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6


      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: web/node_modules
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/yipyap ./cmd/yipyap/

      - name: Tests
        run: go test -v -race ./...

  goreleaser-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6


      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: web/node_modules
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.0
          args: check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6


      - name: Build Docker image
        run: docker build -t yipyap:test .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0


      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: web/node_modules
          key: npm-${{ hashFiles('web/package-lock.json') }}

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arm-build:
    # Cross-compiled on amd64 (pure-Go sqlite, CGO off).
    name: Build ARM64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: lts/*

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Build arm64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/yipyap-linux-arm64 ./cmd/yipyap/
          file dist/yipyap-linux-arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yipyap-linux-arm64
          path: dist/yipyap-linux-arm64
          retention-days: 7
